template: sunspec-inverter-control
products:
  - description:
      de: SunSpec Batterie (Model 124)
      en: SunSpec Battery (Model 124)
capabilities: ["battery-control"]
group: generic
requirements:
  description:
    de: |
      Ein am Wechselrichter eingestellter Mindestladestand auf oder über der Lastspitzenreserve verhindert, dass diese Reserve entladen wird. Die maximale Entladeleistung muss gesetzt sein, damit eine begrenzte Entladerate vorgegeben werden kann.
    en: |
      A minimum charge level set on the inverter at or above the peak-shaving reserve stops that reserve from discharging. Set the maximum discharge power so a limited discharge rate can be commanded.
params:
  - name: usage
    choice: ["battery"]
  - name: modbus
    choice: ["tcpip", "rs485"]
  - name: maxchargerate
  - preset: battery-params
render: |
  {{- if eq .usage "battery" }}
  type: custom
  power:
    source: calc
    add:
    - source: sunspec
      {{- include "modbus" . | indent 4 }}
      value: 160:3:DCW # mppt 3 (charge)
      nan: true
      scale: -1
    - source: sunspec
      {{- include "modbus" . | indent 4 }}
      value: 160:4:DCW # mppt 4 (discharge)
      nan: true
  energy:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value: 160:4:DCWH # mppt 4 (discharge)
    scale: 0.001
  soc:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value: 124:0:ChaState
  batterymode: # model 124
    source: switch
    switch:
    - case: 1 # normal
      set:
        source: sequence
        set:
        - source: const
          value: 0
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value: 124:0:StorCtl_Mod
        - source: const
          value: 100 # %
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value: 124:0:OutWRte
    - case: 2 # hold
      set:
        source: sequence
        set:
        - source: const
          value: 2
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value: 124:0:StorCtl_Mod
        - source: const
          value: 0 # %
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value: 124:0:OutWRte
        - source: const
          value: 0 # s
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value: 124:0:InOutWRte_RvrtTms
    - case: 3 # charge
      set:
        source: sequence
        set:
        - source: const
          value: 1 # on
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value: 124:0:ChaGriSet
        - source: const
          value: 2
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value: 124:0:StorCtl_Mod
        - source: const
          value: -{{ .maxchargerate }} # %
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value: 124:0:OutWRte
        - source: const
          value: 0 # s
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value: 124:0:InOutWRte_RvrtTms
    - case: 4 # holdcharge
      set:
        source: sequence
        set:
        - source: const
          value: 1
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value: 124:0:StorCtl_Mod
        - source: const
          value: 0 # %
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value: 124:0:InWRte
        - source: const
          value: 0 # s
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value: 124:0:InOutWRte_RvrtTms
  {{- if .maxdischargepower }}
  maxdischarge: # limited discharge, W. StorCtl_Mod stays in discharge control.
    source: sequence
    set:
    - source: const
      value: 2
      set:
        source: sunspec
        {{- include "modbus" . | indent 8 }}
        value: 124:0:StorCtl_Mod
    - source: sunspec
      {{- include "modbus" . | indent 6 }}
      value: 124:0:OutWRte
      scale: {{ divf 100 .maxdischargepower }} # % of max discharge power
  {{- end }}
  {{- include "battery-params" . }}
  {{- end }}
